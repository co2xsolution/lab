<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabChem — setup check</title>
<style>
  body{font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       color:#10202b;background:#f2f5f4;margin:0;padding:5vh 5vw}
  main{max-width:720px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px}
  .lead{color:#5b6b74;margin:0 0 22px}
  .row{background:#fff;border:1px solid #d6dfe0;border-left:6px solid #c9d3d8;
       border-radius:5px;padding:14px 16px;margin-bottom:10px}
  .row.pass{border-left-color:#2f6b4f}
  .row.fail{border-left-color:#b3261e}
  .row.warn{border-left-color:#b26a00}
  .row h3{margin:0;font-size:15px;display:flex;gap:8px;align-items:center}
  .badge{font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:3px;
         background:#e6ecec;color:#5b6b74}
  .pass .badge{background:#e3f0e9;color:#2f6b4f}
  .fail .badge{background:#fbe6e4;color:#b3261e}
  .warn .badge{background:#fbf0e0;color:#b26a00}
  .row p{margin:7px 0 0;color:#5b6b74;font-size:14px}
  .row .fix{margin-top:9px;padding:10px 12px;background:#fafcfc;border:1px solid #e6ecec;border-radius:4px;
            color:#10202b;font-size:14px}
  code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
  pre{background:#10202b;color:#cfe0e4;padding:11px 13px;border-radius:4px;overflow:auto;margin:9px 0 0;
      max-height:220px;white-space:pre-wrap;word-break:break-all}
  button{font:inherit;font-weight:600;background:#0e7c86;color:#fff;border:0;border-radius:4px;
         padding:10px 18px;cursor:pointer;margin-bottom:18px}
</style>
</head>
<body>
<main>
  <h1>LabChem setup check</h1>
  <p class="lead">Put this file beside <code>index.html</code> and open it. Every test says what to fix.</p>
  <button onclick="runAll()">Run the checks again</button>
  <div id="out"></div>
</main>

<script src="config.js" onerror="window.__configFailed=true"></script>
<script>
const out = document.getElementById('out');

function report(state, title, detail, fix, raw) {
  const d = document.createElement('div');
  d.className = 'row ' + state;
  d.innerHTML =
    '<h3><span class="badge">' + (state === 'pass' ? 'OK' : state === 'warn' ? 'CHECK' : 'PROBLEM') +
    '</span>' + title + '</h3>' +
    (detail ? '<p>' + detail + '</p>' : '') +
    (fix ? '<div class="fix">' + fix + '</div>' : '') +
    (raw ? '<pre>' + String(raw).replace(/[<&]/g, c => c === '<' ? '&lt;' : '&amp;').slice(0, 1200) + '</pre>' : '');
  out.appendChild(d);
}

function head(url) {
  return fetch(url, { cache: 'no-store' })
    .then(r => ({ ok: r.ok, status: r.status }))
    .catch(e => ({ ok: false, status: 0, err: e.message }));
}

async function runAll() {
  out.innerHTML = '';

  /* 1. where are we */
  report(location.protocol === 'https:' ? 'pass' : 'warn',
    '1. Page address',
    'Serving from <code>' + location.origin + location.pathname + '</code>',
    location.protocol === 'https:' ? '' :
      'The camera scanner needs https. GitHub Pages provides it automatically.');

  /* 2. sibling files */
  for (const [label, path] of [['assets/styles.css', 'assets/styles.css'],
                               ['assets/app.js', 'assets/app.js'],
                               ['config.js', 'config.js']]) {
    const r = await head(path);
    report(r.ok ? 'pass' : 'fail',
      '2. File ' + label,
      r.ok ? 'Found (HTTP ' + r.status + ')' : 'Not found (HTTP ' + (r.status || 'no response') + ')',
      r.ok ? '' :
        'This file must sit at <code>' + location.pathname.replace(/[^/]*$/, '') + path + '</code>. ' +
        'GitHub Pages is case sensitive — <code>assets</code>, not <code>Assets</code>. ' +
        'If you uploaded a folder, move its contents to the repository root.');
  }

  /* 3. config contents */
  const cfg = window.LABCHEM_CONFIG;
  if (!cfg) {
    report('fail', '3. API address', 'config.js did not define <code>window.LABCHEM_CONFIG</code>.',
      'Open config.js. It must read exactly:<br><code>window.LABCHEM_CONFIG = { apiUrl: "https://…/exec" };</code>');
    return;
  }
  const url = String(cfg.apiUrl || '');
  let bad = null;
  if (!url || /PASTE_YOUR/.test(url)) bad = 'It still holds the placeholder text.';
  else if (!/^https:\/\//.test(url)) bad = 'It does not start with https://';
  else if (/\/dev$/.test(url)) bad = 'It ends in /dev, which only works for the script owner.';
  else if (!/\/exec$/.test(url)) bad = 'It does not end in /exec.';

  report(bad ? 'fail' : 'pass', '3. API address',
    bad || 'Looks right.', bad ?
      'Apps Script → <b>Deploy → Manage deployments</b> → copy the <b>Web app URL</b> ending in ' +
      '<code>/exec</code> → paste into <code>config.js</code>.' : '', url || '(empty)');
  if (bad) return;

  /* 4. can the browser reach it at all */
  let getText = '';
  try {
    const r = await fetch(url, { method: 'GET', mode: 'cors', redirect: 'follow', cache: 'no-store' });
    getText = await r.text();
    const isHtmlLogin = /accounts\.google\.com|Sign in|ServiceLogin/i.test(getText) &&
                        !/LabChem API/i.test(getText);
    report(isHtmlLogin ? 'fail' : 'pass', '4. Reaching the API',
      'HTTP ' + r.status + ', ' + getText.length + ' bytes returned.',
      isHtmlLogin ?
        'Google returned its <b>sign-in page</b>, which means the deployment is not public. ' +
        'Redeploy with <b>Execute as: Me</b> and <b>Who has access: Anyone</b>, then use the new URL.' : '',
      getText.slice(0, 400));
  } catch (e) {
    report('fail', '4. Reaching the API', 'The request failed: ' + e.message,
      'Usually CORS, caused by a deployment that is not set to <b>Anyone</b>. ' +
      'It can also mean the URL is wrong or the deployment was deleted.');
    return;
  }

  /* 5. the actual JSON call the app makes */
  try {
    const r = await fetch(url, {
      method: 'POST', mode: 'cors', redirect: 'follow', cache: 'no-store',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: 'getPublicConfig', token: null, args: [] })
    });
    const text = await r.text();
    let json = null;
    try { json = JSON.parse(text); } catch (e) { /* not json */ }

    if (!json) {
      report('fail', '5. API answering in JSON', 'The reply was not JSON (HTTP ' + r.status + ').',
        'If the reply below is a Google sign-in page, redeploy with access <b>Anyone</b>. ' +
        'If it is an Apps Script error page, open <b>Executions</b> in the editor to see which ' +
        'function failed — usually <code>Api.gs</code> is missing, or <code>installDatabase</code> ' +
        'was never run.', text.slice(0, 700));
      return;
    }
    if (!json.ok) {
      report('fail', '5. API answering in JSON', 'The server replied with an error.',
        json.error && /not installed/i.test(json.error) ?
          'Run <code>installDatabase</code> once from the Apps Script editor.' :
          'Check <b>Executions</b> in the Apps Script editor for the stack trace.',
        JSON.stringify(json, null, 2));
      return;
    }

    report('pass', '5. API answering in JSON',
      'Connected to <b>' + (json.data.app.org || '—') + '</b>, version ' + json.data.app.version + '.',
      'Everything is wired up. Open <code>index.html</code> and sign in.',
      JSON.stringify(json.data, null, 2));

    /* 6. QR target sanity */
    if (!json.data.app.url) {
      report('warn', '6. QR label target',
        'The backend has no APP_URL stored yet.',
        'Run <code>refreshAppUrl</code> once in the Apps Script editor, then set ' +
        '<code>SITE_URL</code> in Settings to <code>' + location.origin +
        location.pathname.replace(/[^/]*$/, '') + '</code> so QR scans open this site.');
    }
  } catch (e) {
    report('fail', '5. API answering in JSON', 'The POST failed: ' + e.message,
      'The GET worked but the POST did not. Confirm <code>Api.gs</code> exists in the project ' +
      'and that you created a <b>new version</b> when redeploying — Apps Script serves the last ' +
      'deployed version, not your edits.');
  }
}

runAll();
</script>
</body>
</html>
